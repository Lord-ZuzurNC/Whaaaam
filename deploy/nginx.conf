# Whaaaam — reverse proxy configuration.
#
# This file exists because a rate limit described in a README enforces nothing.
# The application caps a single request (256 KB of body, 200 URLs, a 45 s
# deadline); only the proxy sees every worker's traffic, so only the proxy can
# cap how many requests one caller makes.

# ~16k addresses per 10 MB. Tune `rate` to taste; the point is that it exists.
limit_req_zone $binary_remote_addr zone=whaaaam_check:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=whaaaam_conn:10m;

server {
    listen 443 ssl http2;
    server_name whaaaam.example;

    # ssl_certificate / ssl_certificate_key configured by your ACME client.

    client_max_body_size 256k;   # mirrors MAX_CONTENT_LENGTH in web.py
    limit_conn whaaaam_conn 8;

    location /analyze {
        limit_req zone=whaaaam_check burst=5 nodelay;
        limit_req_status 429;    # app.js names 429 specifically to the user

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than CHECK_DEADLINE (45 s) so the application returns its own
        # partial answer rather than the proxy cutting the connection first.
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
