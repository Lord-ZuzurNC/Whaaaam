<!DOCTYPE html>
<html lang="en" data-theme="mocha">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Paste your CurseForge and Modrinth mod links. Whaaaam tells you which Minecraft version and loader your whole list has in common.">
    <meta name="author" content="Lord_ZuzurNC">
    <title>Whaaaam</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/x-icon" href="/static/favico.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <!-- Ahead of every stylesheet on purpose: a classic script blocks on any
         pending sheet before it runs, so placing this after the Google Fonts
         link would let a slow CDN delay the theme attribute and the first
         paint. It has no CSS dependency. -->
    <script src="/static/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Subset to the wordmark's own glyphs (W, h, a, m). If the wordmark text
         ever changes, widen the text= parameter to match or it will not render. -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&text=Whaam&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header>
      <h1>Whaaaam</h1>
      <div class="theme-switcher" role="radiogroup" aria-label="Theme">
        <div class="theme-option" data-theme="latte" role="radio" aria-label="Latte" aria-checked="false" tabindex="-1">
          <div class="theme-circle"></div>
        </div>
        <div class="theme-option" data-theme="frappe" role="radio" aria-label="Frappé" aria-checked="false" tabindex="-1">
          <div class="theme-circle"></div>
        </div>
        <div class="theme-option" data-theme="macchiato" role="radio" aria-label="Macchiato" aria-checked="false" tabindex="-1">
          <div class="theme-circle"></div>
        </div>
        <div class="theme-option" data-theme="mocha" role="radio" aria-label="Mocha" aria-checked="true" tabindex="0">
          <div class="theme-circle"></div>
        </div>
        <div class="theme-indicator"></div>
      </div>
    </header>

    <main>
      <!-- Input + check block -->
      <section id="analyze-block" class="input-block" aria-labelledby="analyze-heading">
        <h2 id="analyze-heading" class="visually-hidden">Your mod list</h2>
        <label id="mod-urls-label" for="mod-urls">
          Mod URLs
          <span class="label-hint">One CurseForge or Modrinth URL per line</span>
        </label>
        <textarea
          id="mod-urls"
          spellcheck="false"
          autocapitalize="none"
          autocorrect="off"
          aria-describedby="form-status"
          placeholder="https://www.curseforge.com/minecraft/mc-mods/jei&#10;https://modrinth.com/mod/sodium"
        ></textarea>
        <p id="form-status" class="form-status" hidden></p>
        <div class="input-actions">
          <button id="analyze-btn" type="button" class="btn btn-primary">Check compatibility</button>
        </div>
      </section>

      <!-- A real <dialog>, opened with showModal(): the focus trap, Escape and
           top layer come from the platform. The hand-rolled scrim let Tab walk
           into the footer links behind an opaque overlay. The spinner and the
           dots stay aria-hidden because their text is on a timer; #sr-announce
           carries the state instead. -->
      <dialog id="loading-overlay" aria-label="Checking mods">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loading-text" aria-hidden="true"><span class="loading-label">Checking mods</span><span class="loading-dots"></span></div>
        <button id="cancel-check" type="button" class="btn">Cancel</button>
      </dialog>

      <!-- The single live region. Receives one message per state change, so a
           screen reader hears the verdict rather than the whole results table. -->
      <p id="sr-announce" class="visually-hidden" role="status" aria-live="polite"></p>

      <!-- The answer. It sits directly under the input, above its own
           substantiation: PRODUCT.md principle 4, "answer first". -->
      <section id="results" aria-labelledby="results-heading">
        <h2 id="results-heading" class="visually-hidden">Result</h2>
        <p class="results-placeholder">
          Paste your mod list above to find the Minecraft version and loader they all share.
        </p>
      </section>

      <!-- Filters and exports substantiate the answer, so they follow it, and
           they stay hidden until there is something to filter or export. -->
      <section id="filter-block" class="filters-block" aria-labelledby="filter-heading" hidden>
        <h2 id="filter-heading" class="visually-hidden">Filter and export</h2>
        <div class="filters-left">
          <label for="filter-version">Version</label>
          <select id="filter-version"><option value="">All</option></select>
          <label for="filter-loader">Loader</label>
          <select id="filter-loader"><option value="">All</option></select>
          <!-- Shown only when there is something outside the consensus. The
               label text is rewritten with the live count and version. -->
          <span id="outside-field" class="outside-field" hidden>
            <input type="checkbox" id="filter-outside">
            <label for="filter-outside">Only mods outside the consensus</label>
          </span>
        </div>
        <div class="filters-right">
          <button id="export-md" type="button" class="btn">Export Markdown</button>
          <button id="export-csv" type="button" class="btn">Export CSV</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>

    <footer class="footer">
      <div class="footer-row">
        <div class="footer-col">
          <img src="/static/logo-48.png" alt="" width="24" height="24" class="footer-icon">
        </div>
        <div class="footer-col">
          <p class="footer-info">
            Whaaaam —
            <a
              href="https://github.com/Lord-ZuzurNC/Whaaaam?tab=MIT-1-ov-file"
              target="_blank"
              rel="noopener noreferrer"
              >MIT License © 2026</a
            >
          </p>
        </div>
        <div class="footer-col">
          <div class="icons">
            <a href="https://github.com/Lord-ZuzurNC/Whaaaam" target="_blank" rel="noopener noreferrer">
              <img src="/static/github.svg" alt="Whaaaam on GitHub" width="22" height="22" class="github-icon">
            </a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
